<!doctype html><html lang="ko"><meta charset="utf-8"><title>노면·차량 높이 검증</title>
<style>body{margin:0;font:14px system-ui;background:#102329;color:#eee}canvas{position:fixed;inset:0}section{position:fixed;left:16px;top:16px;z-index:2;max-width:700px;background:#102329ed;padding:12px 16px;border-radius:10px}button,select{font:inherit;color:#dff5e9;background:#29444b;border:1px solid #52717a;border-radius:5px;padding:7px;margin:3px}output{display:block;margin-top:8px;font-size:12px}</style>
<canvas id="scene" aria-label="실제 경사 도로 높이 확인 화면"></canvas><section>렌더링 검증 · 실제 저장 경로 <select id="vehicle" aria-label="차량"><option value="alphard">알파드</option><option value="prius">프리우스</option></select><button data-station="15">출발 구간</button><button data-station="1200">1.2 km 경사</button><button data-station="2200">2.2 km 경사</button><button data-station="end">차탄 주차장</button><button id="close">내비 확대</button><output id="status">자료를 불러오는 중…</output></section>
<script type="module">
import{DriveRenderer}from'../drive-renderer.mjs';import{VEHICLES}from'../vehicles.mjs';import{projection,REGIONS}from'../map-data.mjs';import{sceneFeatures}from'../scene-features.mjs';import{loadTerrain}from'../terrain.mjs';import{headingBetween,nearestOnSegment}from'../simulation.mjs';
const j=p=>fetch('../'+p).then(r=>r.json()),proj=projection(REGIONS.find(r=>r.island).origin),renderer=new DriveRenderer(document.querySelector('#scene'));
const[training,preview,signal,aqua,scene,aquaScene,boundary,elevation]=await Promise.all([j('data/training-routes.json'),j('data/preview-cache.json'),j('data/signal-roads.json'),j('data/aqua-roads.json'),j('data/preview-scene.json'),j('data/aqua-scene.json'),j('data/okinawa-main-island.geojson'),loadTerrain(proj)]);
const route=training.routes.find(r=>r.data.routes[0].distance>60000).data.routes[0].geometry.coordinates.map(proj.toLocal),roads=[...new Map([...preview.roads.elements,...signal.roads.elements,...aqua.elements].map(e=>[e.id,e])).values()].filter(e=>e.geometry?.length>1).map(e=>({...e,points:e.geometry.map(p=>proj.toLocal([p.lon,p.lat]))})),features=[...sceneFeatures(scene,proj),...sceneFeatures(aquaScene,proj)];
let car=VEHICLES[1],position,heading,station=15,navZoom=false,time=0,traffic=[];
function along(distance){let left=distance;for(let i=1;i<route.length;i++){const a=route[i-1],b=route[i],n=Math.hypot(b.x-a.x,b.y-a.y);if(left<=n)return {x:a.x+(b.x-a.x)*left/n,y:a.y+(b.y-a.y)*left/n,heading:headingBetween(a,b)};left-=n;}const p=route.at(-1);return {...p,heading:headingBetween(route.at(-2),p)};}
function load(){const p=station==='end'?{...route.at(-1),heading:headingBetween(route.at(-2),route.at(-1))}:along(station);heading=p.heading;position={x:p.x-Math.cos(heading)*1.55,y:p.y-Math.sin(heading)*1.55};traffic=station==='end'?[]:[18,44,76].map((d,i)=>{const a=along(Number(station)+d);return {...a,x:a.x-Math.cos(a.heading)*1.55,y:a.y-Math.sin(a.heading)*1.55,id:i,kind:i===1?'van':'sedan',length:i===1?4.9:4.3,width:1.8,color:['#405769','#f4f0e3','#b15347'][i]};});renderer.setup({base:position,roads,features,coast:boundary.geometry.coordinates[0].map(proj.toLocal),elevation,signals:[],bays:[],car,projection:proj});const normal=renderer.surface.height(position);document.querySelector('#status').textContent=`${car.name} · 경로 ${station} m · 노면 표고 ${normal.toFixed(2)} m · 도로 / 지형 간격 0.12 m`;
}
for(const b of document.querySelectorAll('[data-station]'))b.onclick=()=>{station=b.dataset.station==='end'?'end':Number(b.dataset.station);load();};document.querySelector('#vehicle').onchange=e=>{car=VEHICLES.find(c=>c.id===e.target.value);load();};document.querySelector('#close').onclick=()=>navZoom=!navZoom;
function drawNavigation(c,w,h,scale){c.fillStyle='#0d2932';c.fillRect(0,0,w,h);const cv=p=>{const dx=p.x-position.x,dy=p.y-position.y;return [w/2+(dx*Math.cos(heading)+dy*Math.sin(heading))*scale,h*.68+(-dx*Math.sin(heading)+dy*Math.cos(heading))*scale];};c.lineCap='round';for(const road of roads){c.beginPath();road.points.forEach((p,i)=>{const q=cv(p);i?c.lineTo(...q):c.moveTo(...q);});c.lineWidth=8;c.strokeStyle='#43656b';c.stroke();}c.beginPath();route.forEach((p,i)=>{const q=cv(p);i?c.lineTo(...q):c.moveTo(...q);});c.lineWidth=13;c.strokeStyle='#b7f4cc';c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(w/2,h*.68-20);c.lineTo(w/2-12,h*.68+12);c.lineTo(w/2+12,h*.68+12);c.fill();}
load();function frame(){time+=1/60;renderer.render({position,heading,speed:0,gear:1,steer:0,navZoom,parkingBrake:false,time,traffic,drawNavigation,navInfo:{instruction:'실제 경로 노면 확인',destination:'아쿠아 팰리스 차탄',remaining:'',distanceToTurn:200}});requestAnimationFrame(frame);}frame();
</script></html>

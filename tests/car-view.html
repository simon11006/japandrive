<!doctype html><meta charset="utf-8"><title>차량 외관 확인</title><style>body{margin:0;background:#9fb7bd}</style>
<script type="module">
import * as THREE from "../vendor/three.module.js";
import { makeCarModel } from "../car-model.mjs";
import { makeSky, SUN_DIRECTION } from "../graphics.mjs";
const q = new URLSearchParams(location.search), id = q.get("car") || "prius", angle = Number(q.get("a") || 0.7);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; document.body.append(r.domElement);
const scene = new THREE.Scene(); scene.add(makeSky());
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new THREE.Scene().add(makeSky()) && (()=>{const s=new THREE.Scene();s.add(makeSky());return s;})()).texture;
scene.add(new THREE.HemisphereLight("#d6ecff", "#6f7a5c", 1.2));
const sun = new THREE.DirectionalLight("#fff1d6", 3); sun.position.copy(SUN_DIRECTION).multiplyScalar(20); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: "#6b6f70" })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const car = makeCarModel(id); scene.add(car);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 5000);
cam.position.set(Math.cos(angle) * 9, Number(q.get("h") || 1.6), Math.sin(angle) * 9); cam.lookAt(0, 0.7, 0);
r.render(scene, cam); document.title = "ready";
</script>

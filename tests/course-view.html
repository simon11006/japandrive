<!doctype html><html lang="ko"><meta charset="utf-8"><title>코스 배경·노면 검증</title>
<style>body{margin:0;font:13px system-ui;background:#10252a;color:white}canvas{position:fixed;inset:0}section{position:fixed;top:12px;left:12px;z-index:3;background:#10252aee;padding:12px;border:1px solid #91b3a0;border-radius:8px}button,select{padding:6px;background:#23474c;color:white;border:1px solid #709b89;margin:3px}output{display:block;max-width:650px;padding-top:8px}</style>
<canvas id="scene"></canvas><section>개발 검증 화면 <select id="course" aria-label="검증 코스"></select><select id="station" aria-label="검증 위치"><option value="0">출발</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="parking">주차면 18m 전</option><option value="100">주차면 중앙</option><option value="turn">첫 회전 구간</option><option value="signal">첫 신호 교차로</option><option value="arrow">우회전 화살표 교차로</option><option value="brake">앞차 브레이크등</option><option value="pedestrian">보행자 횡단보도</option><option value="gate">입구 요금소</option></select><select id="car" aria-label="검증 차량"><option value="alphard">알파드</option><option value="prius">프리우스</option></select><button id="view">주변 보기</button><button id="reverse">전진 / 후진</button><select id="phase" aria-label="검증 신호"><option value="auto">신호 자동</option><option value="green">녹색</option><option value="arrow">빨강+우회전 화살표</option><option value="yellow">화살표 종료 황색</option></select><select id="people-phase" aria-label="보행자 검증 시점"><option value="auto">보행자 자동</option><option value="waiting">보도 대기</option><option value="walking">횡단 중</option><option value="done">횡단 완료</option></select><button id="traffic-hold">앞차 정차 / 출발</button><output id="status">자료 준비 중…</output></section>
<script type="module">
import{courseElevation}from'../course-surface.mjs';import{DriveRenderer}from'../drive-renderer.mjs';import{projection,routeProgress}from'../map-data.mjs';import{sceneFeatures}from'../scene-features.mjs';import{VEHICLES}from'../vehicles.mjs';import{loadTerrain}from'../terrain.mjs';import{courseParking,courseRoadStore}from'../courses.mjs';import{headingBetween,distance,TrafficSimulation,parkingStatus,signalPhase,signalRightArrow}from'../simulation.mjs';import{drawNavMap,drawCarMarker}from'../nav-display.mjs';
import{nextNavigationStep}from'../navigation.mjs';
const $=s=>document.querySelector(s),j=p=>fetch('../'+p).then(r=>r.json()),dummy=null;let proj,elevation;
const [catalog,atlas,boundary]=await Promise.all([j('data/driving-courses.json'),j('data/course-terrain.json'),j('data/okinawa-main-island.geojson')]);
const renderer=new DriveRenderer($('#scene'));let bundle,route,roads,features,position,heading,car=VEHICLES[1],time=0,intro=false,gear=1,traffic,goal,held=0,courseName="",holdLead=true,lead,navInfo={},signalsForView=[];
for(const c of catalog.courses){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;$('#course').append(o);}
function along(m){for(let i=1;i<route.length;i++){const a=route[i-1],b=route[i],n=distance(a,b);if(m<=n)return{x:a.x+(b.x-a.x)*m/n,y:a.y+(b.y-a.y)*m/n,heading:headingBetween(a,b)};m-=n;}return{...route.at(-1),heading:headingBetween(route.at(-2),route.at(-1))};}
async function load(){try{const c=catalog.courses.find(c=>c.id===$('#course').value);bundle=await j(c.bundle);proj=projection(bundle.origin);elevation=await loadTerrain(proj);route=bundle.route.geometry.coordinates.map(proj.toLocal);roads=courseRoadStore(bundle,proj).roads;features=sceneFeatures(bundle.scene,proj);goal=courseParking(bundle.parking,proj);const nodes=bundle.scene.elements.filter(e=>e.type==='node').map(e=>({...e,...proj.toLocal([e.lon,e.lat])}));const signals=bundle.signals.map(e=>({...e,...proj.toLocal([e.lon,e.lat])}));const maneuvers=bundle.route.legs.flatMap(l=>l.steps).map(s=>({...s,atDistance:routeProgress(route,proj.toLocal(s.maneuver.location),bundle.route.distance).travelled}));const tolls=bundle.tolls.map(g=>({...g,...proj.toLocal(g.geo),mode:'etc',opening:0,state:'closed'}));
let p=along(bundle.route.distance*(Number($('#station').value)||0)/100);if($('#station').value==='100')p={...goal.center,heading:goal.heading};if($('#station').value==='parking')p={x:goal.center.x-Math.sin(goal.heading)*18,y:goal.center.y+Math.cos(goal.heading)*18,heading:goal.heading};if($('#station').value==='turn'){const first=maneuvers.find(m=>m.maneuver.type==='turn'&&m.atDistance>14);if(first)p=along(first.atDistance-22);}if($('#station').value==='gate'&&tolls.length)p={x:tolls[0].x-Math.sin(tolls[0].heading)*22,y:tolls[0].y+Math.cos(tolls[0].heading)*22,heading:tolls[0].heading};if(['signal','arrow'].includes($('#station').value)&&signals.length){const sig=$('#station').value==='arrow'?(signals.find(s=>s.profile==='arrow')||signals[0]):signals[0];let best={distance:Infinity};for(let i=1;i<route.length;i++){const d=distance(route[i],sig);if(d<best.distance)best={distance:d,heading:headingBetween(route[i-1],route[i])};}p={x:sig.x-Math.sin(best.heading)*32,y:sig.y+Math.cos(best.heading)*32,heading:best.heading};}heading=p.heading;position=['100','parking'].includes($('#station').value)?{x:p.x,y:p.y}:{x:p.x-Math.cos(heading)*1.5,y:p.y-Math.sin(heading)*1.5};car=VEHICLES.find(v=>v.id===$('#car').value);renderer.setup({base:position,roads,features,coast:c.region==='오키나와'?boundary.geometry.coordinates[0].map(proj.toLocal):null,elevation:courseElevation(elevation,roads,tolls,goal),signals,bays:[goal],car,projection:proj,course:{theme:c.theme,style:c.style,nodes,route,maneuvers,tolls,aerial:atlas.courses[c.id]}});traffic=new TrafficSimulation(roads.filter(r=>!r.id.startsWith('practice-')),signals,position,28);signalsForView=signals;traffic.pedestrianStop=(v,path)=>renderer.encounters?.stopDistance(v,path)??Infinity;traffic.pedestrianBlocked=(a,b)=>renderer.encounters?.blocksMovement(a,b)??false;if($('#station').value==='pedestrian'){const c=renderer.encounters.crossings.find(c=>!c.signal)||renderer.encounters.crossings[0];if(c){heading=c.heading;position={x:c.x-Math.sin(heading)*13-Math.cos(heading)*1.5,y:c.y+Math.cos(heading)*13-Math.sin(heading)*1.5};}}lead=traffic.cars.find(n=>signals.every(s=>distance(n,s)>80))||traffic.cars[0];if($('#station').value==='brake'&&lead){lead.speed=0;heading=lead.heading;position={x:lead.x-Math.sin(heading)*13,y:lead.y+Math.cos(heading)*13};}held=0;courseName=c.name;$('#status').textContent=`${c.name} · ${$('#station').selectedOptions[0].text} · 도로 ${roads.length}개 / 건물 ${features.filter(f=>f.tags.building).length}개 / 신호 ${signals.length}개 · 표고 ${renderer.elevation(position).toFixed(1)}m`;
}catch(e){$('#status').textContent='검증 오류: '+e.stack;}}
for(const id of ['#course','#station','#car'])$(id).onchange=load;$('#view').onclick=()=>intro=!intro;$('#traffic-hold').onclick=()=>holdLead=!holdLead;$('#reverse').onclick=()=>gear*=-1;
function nav(c,w,h,scale){const convert=p=>{const dx=p.x-position.x,dy=p.y-position.y;return{x:w/2+(dx*Math.cos(heading)+dy*Math.sin(heading))*scale,y:h*.7+(-dx*Math.sin(heading)+dy*Math.cos(heading))*scale};};drawNavMap(c,w,h,scale,{roads,features,route,goal:goal.center,parkingPoints:goal.points,routeIndex:navInfo.routeIndex,currentPosition:position,turnPoint:navInfo.turnPoint,convert});drawCarMarker(c,w/2,h*.7);}
await load();let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;if(position){let clock=time;const signal=signalsForView.find(s=>s.profile==='arrow');if(signal&&$('#phase').value!=='auto'){clock=0;const mode=$('#phase').value;while(clock<110&&!(mode==='arrow'?signalRightArrow(signal,heading,clock):mode==='yellow'?(signalPhase(signal,heading,clock)==='yellow'&&signalRightArrow(signal,heading,clock-.2)):signalPhase(signal,heading,clock)==='green'))clock+=.1;}const progress=routeProgress(route,position,bundle.route.distance),steps=bundle.route.legs.flatMap(l=>l.steps).map(s=>({...s,point:proj.toLocal(s.maneuver.location),atDistance:routeProgress(route,proj.toLocal(s.maneuver.location),bundle.route.distance).travelled})),next=nextNavigationStep(steps,progress.travelled,progress.remaining);navInfo={toTurn:next.toTurn,maneuver:next.next?.maneuver,action:next.next?.maneuver.modifier==='left'?'좌회전':'우회전',routeIndex:progress.index,turnPoint:next.next?.point,remainingMeters:progress.remaining,destination:bundle.parking.name,instruction:'초록색 P 주차면 안에 차 전체를 넣으세요',parking:distance(position,goal.center)<40,parkingDistance:distance(position,goal.center)};if(lead&&$('#station').value==='brake'){lead.desired=holdLead?0:7;$('#status').textContent=courseName+' · 앞차 '+(lead.speed<.1?'정차':'이동')+' · 브레이크등 '+(lead.braking?'켜짐':'꺼짐');}if($('#station').value==='100'){const park=parkingStatus({...position,heading,speed:0,parkingBrake:false},car,goal,held);held=park.ready?held+dt:0;$('#status').textContent=courseName+' · '+(park.complete?'주차 완료 · 브레이크만으로 정차 확인':'목표 주차면 확인 중…');}if(renderer.encounters){if($('#people-phase').value==='auto')renderer.encounters.tick(dt,clock,{...position,heading,speed:0,length:car.length,width:car.width},traffic?.cars||[]);else{for(const p of renderer.encounters.people){p.state=$('#people-phase').value;p.active=true;p.progress=p.state==='walking'?.45:p.state==='done'?1:0;p.walked=p.progress*8;}renderer.encounters.place();}}traffic?.tick(dt,clock,{...position,heading,speed:0,length:car.length,width:car.width});renderer.render({position,heading,time:clock,gear,speed:0,steer:0,parkingBrake:true,navZoom:false,traffic:traffic?.cars||[],intro,dt,drawNavigation:nav,navInfo});}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>

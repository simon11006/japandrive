<!doctype html><html lang="ko"><meta charset="utf-8"><title>코스 배경·노면 검증</title>
<style>body{margin:0;font:13px system-ui;background:#10252a;color:white}canvas{position:fixed;inset:0}section{position:fixed;top:12px;left:12px;z-index:3;background:#10252aee;padding:12px;border:1px solid #91b3a0;border-radius:8px}button,select{padding:6px;background:#23474c;color:white;border:1px solid #709b89;margin:3px}output{display:block;max-width:650px;padding-top:8px}</style>
<canvas id="scene"></canvas><section>개발 검증 화면 <select id="course" aria-label="검증 코스"></select><select id="station" aria-label="검증 위치"><option value="0">출발</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">목적지 주차장</option><option value="gate">입구 요금소</option></select><select id="car" aria-label="검증 차량"><option value="alphard">알파드</option><option value="prius">프리우스</option></select><button id="view">주변 보기</button><button id="reverse">전진 / 후진</button><output id="status">자료 준비 중…</output></section>
<script type="module">
import{courseElevation}from'../course-surface.mjs';import{DriveRenderer}from'../drive-renderer.mjs';import{projection}from'../map-data.mjs';import{sceneFeatures}from'../scene-features.mjs';import{VEHICLES}from'../vehicles.mjs';import{loadTerrain}from'../terrain.mjs';import{courseParking,courseRoadStore}from'../courses.mjs';import{headingBetween,distance,TrafficSimulation}from'../simulation.mjs';import{drawNavMap,drawCarMarker}from'../nav-display.mjs';
const $=s=>document.querySelector(s),j=p=>fetch('../'+p).then(r=>r.json()),proj=projection([127.68,26.214]);
const [catalog,atlas,boundary,elevation]=await Promise.all([j('data/driving-courses.json'),j('data/course-terrain.json'),j('data/okinawa-main-island.geojson'),loadTerrain(proj)]);
const renderer=new DriveRenderer($('#scene'));let bundle,route,roads,features,position,heading,car=VEHICLES[1],time=0,intro=false,gear=1,traffic,goal;
for(const c of catalog.courses){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;$('#course').append(o);}
function along(m){for(let i=1;i<route.length;i++){const a=route[i-1],b=route[i],n=distance(a,b);if(m<=n)return{x:a.x+(b.x-a.x)*m/n,y:a.y+(b.y-a.y)*m/n,heading:headingBetween(a,b)};m-=n;}return{...route.at(-1),heading:headingBetween(route.at(-2),route.at(-1))};}
async function load(){try{const c=catalog.courses.find(c=>c.id===$('#course').value);bundle=await j(c.bundle);route=bundle.route.geometry.coordinates.map(proj.toLocal);roads=courseRoadStore(bundle,proj).roads;features=sceneFeatures(bundle.scene,proj).filter(f=>f.tags.building||f.tags.amenity==='parking'||f.tags.natural||f.tags.landuse);goal=courseParking(bundle.parking,proj);const nodes=bundle.scene.elements.filter(e=>e.type==='node').map(e=>({...e,...proj.toLocal([e.lon,e.lat])}));const signals=bundle.signals.map(e=>({...e,...proj.toLocal([e.lon,e.lat])}));const tolls=bundle.tolls.map(g=>({...g,...proj.toLocal(g.geo),mode:'etc',opening:0,state:'closed'}));
let p=along(bundle.route.distance*(Number($('#station').value)||0)/100);if($('#station').value==='100')p={...goal.center,heading:goal.heading};if($('#station').value==='gate'&&tolls.length)p={x:tolls[0].x-Math.sin(tolls[0].heading)*22,y:tolls[0].y+Math.cos(tolls[0].heading)*22,heading:tolls[0].heading};heading=p.heading;position={x:p.x-Math.cos(heading)*1.5,y:p.y-Math.sin(heading)*1.5};car=VEHICLES.find(v=>v.id===$('#car').value);renderer.setup({base:position,roads,features,coast:boundary.geometry.coordinates[0].map(proj.toLocal),elevation:courseElevation(elevation,roads,tolls,goal),signals,bays:[goal],car,projection:proj,course:{theme:c.theme,nodes,route,tolls,aerial:atlas.courses[c.id]}});traffic=new TrafficSimulation(roads.filter(r=>!r.id.startsWith('practice-')),signals,position,28);$('#status').textContent=`${c.name} · ${$('#station').selectedOptions[0].text} · 도로 ${roads.length}개 / 건물 ${features.filter(f=>f.tags.building).length}개 / 신호 ${signals.length}개 · 표고 ${renderer.elevation(position).toFixed(1)}m`;
}catch(e){$('#status').textContent='검증 오류: '+e.stack;}}
for(const id of ['#course','#station','#car'])$(id).onchange=load;$('#view').onclick=()=>intro=!intro;$('#reverse').onclick=()=>gear*=-1;
function nav(c,w,h,scale){const convert=p=>{const dx=p.x-position.x,dy=p.y-position.y;return{x:w/2+(dx*Math.cos(heading)+dy*Math.sin(heading))*scale,y:h*.7+(-dx*Math.sin(heading)+dy*Math.cos(heading))*scale};};drawNavMap(c,w,h,scale,{roads,features,route,goal:goal.center,convert});drawCarMarker(c,w/2,h*.7);}
await load();let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;if(position){traffic?.tick(dt,time,{...position,heading,speed:0,length:car.length,width:car.width});renderer.render({position,heading,time,gear,speed:0,steer:0,parkingBrake:true,navZoom:false,traffic:traffic?.cars||[],intro,dt,drawNavigation:nav,navInfo:{toTurn:120,remainingMeters:500,destination:bundle.parking.name,instruction:'검증 화면',remaining:'500 m'}});}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
